

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 28px 20px;
      text-align: center;
      background: #151d32;
      border: 1px solid #293653;
      border-radius: 20px;
      box-shadow: 0 12px 35px #00000040;
    }

    h1 { color: #70c8ff; }

    .subtitle, .note { color: #bdc9df; }

    #answerText {
      min-height: 65px;
      margin: 22px 0;
      padding: 16px;
      border-radius: 12px;
      background: #0b1020;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-align: left;
    }

    #statusText {
      min-height: 24px;
      color: #9db5d9;
      font-size: 14px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #465879;
      border-radius: 10px;
      background: #0b1020;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: none;
      border-radius: 10px;
      background: #1689e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.55; }
    button.secondary { background: #293653; }

    .note {
      font-size: 12px;
      line-height: 1.5;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>⚡ My AI Assistant</h1>
    <p class="subtitle">
      Ask me a question by typing or speaking.
    </p>

    <div id="answerText" aria-live="polite">
      Hello! I'm ready to help you.
    </div>

    <p id="statusText">Ready!</p>

    <form id="questionForm">
      <input
        id="questionInput"
        type="text"
        placeholder="Ask me anything..."
        autocomplete="off"
        required
      >
      <button id="askButton" type="submit">Ask AI</button>
    </form>

    <button id="voiceButton" class="secondary" type="button">
      🎤 Try a voice command
    </button>

    <button id="speakButton" class="secondary" type="button">
      🔊 Make my assistant speak
    </button>

    <button id="stopButton" class="secondary" type="button">
      🔇 Stop speaking
    </button>

    <p class="note">
      Internet required. Answers come from Vireonix.
      Do not enter passwords or private information.
    </p>
  </main>

  <script>
    const answerText = document.getElementById("answerText");
    const statusText = document.getElementById("statusText");
    const questionInput = document.getElementById("questionInput");
    const questionForm = document.getElementById("questionForm");
    const askButton = document.getElementById("askButton");
    const voiceButton = document.getElementById("voiceButton");
    const speakButton = document.getElementById("speakButton");
    const stopButton = document.getElementById("stopButton");

    function speak(message) {
      answerText.textContent = message;

      if (!("speechSynthesis" in window)) {
        statusText.textContent =
          "Your browser cannot speak answers. The text is displayed.";
        return;
      }

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(message);
      speech.lang = "en-ZA";
      speech.rate = 1;
      speech.pitch = 1;

      speech.onstart = () => {
        statusText.textContent = "Speaking...";
      };

      speech.onend = () => {
        statusText.textContent = "Ready for your next question!";
      };

      speech.onerror = () => {
        statusText.textContent =
          "Answer displayed, but speech may be unavailable.";
      };

      window.speechSynthesis.speak(speech);
    }

    async function answerCommand(command) {
      const question = command.trim();

      if (!question) {
        statusText.textContent = "Please enter a question.";
        return;
      }

      window.speechSynthesis.cancel();
      answerText.textContent = "You asked: " + question;
      statusText.textContent = "Connecting to AI...";
      askButton.disabled = true;
      voiceButton.disabled = true;

      try {
        const response = await fetch(
          "https://vireonix.ai/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "auto",
              messages: [
                {
                  role: "system",
                  content:
                    "You are a helpful, friendly AI assistant. " +
                    "Answer clearly and accurately. " +
                    "Use simple language when useful. " +
                    "Admit when you are unsure. " +
                    "Keep answers reasonably concise for speech."
                },
                {
                  role: "user",
                  content: question
                }
              ]
            })
          }
        );

        if (!response.ok) {
          const details = await response.text().catch(() => "");
          console.error("Vireonix HTTP error:", response.status, details);
          throw new Error(
            "AI service error " + response.status +
            ". Please try again later."
          );
        }

        const data = await response.json();
        const reply = data?.choices?.[0]?.message?.content;

        if (typeof reply !== "string" || !reply.trim()) {
          console.error("Unexpected AI response:", data);
          throw new Error(
            "The AI service returned no readable answer."
          );
        }

        speak(reply.trim());

      } catch (error) {
        console.error("AI connection diagnostic:", error);

        answerText.textContent =
          "Sorry, I couldn't get an AI answer right now.";

        if (error instanceof TypeError) {
          statusText.textContent =
            "Browser/network error: the request could not be completed. " +
            "Possible causes include CORS restrictions or a network issue.";
        } else {
          statusText.textContent = error.message;
        }

      } finally {
        askButton.disabled = false;
        voiceButton.disabled = false;
      }
    }

    questionForm.addEventListener("submit", function(event) {
      event.preventDefault();
      answerCommand(questionInput.value);
    });

    speakButton.addEventListener("click", function() {
      speak(
        "Hello! I'm your AI assistant. " +
        "Type a question or use the microphone to speak to me."
      );
    });

    stopButton.addEventListener("click", function() {
      window.speechSynthesis.cancel();
      statusText.textContent = "Speech stopped.";
    });

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-ZA";
      recognition.continuous = false;
      recognition.interimResults = false;

      voiceButton.addEventListener("click", function() {
        try {
          statusText.textContent = "Listening! Ask your question.";
          recognition.start();
        } catch (error) {
          statusText.textContent =
            "Please wait a moment and try the microphone again.";
        }
      });

      recognition.onresult = function(event) {
        const command = event.results[0][0].transcript;
        questionInput.value = command;
        answerCommand(command);
      };

      recognition.onerror = function(event) {
        statusText.textContent =
          event.error === "not-allowed"
            ? "Please allow microphone access in your browser."
            : "I couldn't hear that clearly. Please try again.";
      };

    } else {
      voiceButton.addEventListener("click", function() {
        statusText.textContent =
          "Voice recognition isn't supported here. Please type instead.";
      });
    }
  </script>
</body>
</html>
